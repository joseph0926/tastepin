<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>취향 위반 예시</title>
  <style>
    body { margin: 0; background: #f7efdc; color: #333; font-family: Inter, Arial, sans-serif; }
    h1 { font-size: 20px; background: linear-gradient(90deg, #7c3aed, #ec4899); -webkit-background-clip: text; color: transparent; }
    .neon { color: #22d3ee; text-shadow: 0 0 12px #22d3ee; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); padding: 20px; transition: transform 0.8s; }
    .faint { color: #b8b0a0; }
    .tag-blue { color: #2563eb; } .tag-green { color: #16a34a; } .tag-red { color: #dc2626; } .tag-orange { color: #ea580c; }
    .body-ko { font-size: 13px; line-height: 1.3; }
    .pill { border-radius: 999px; padding: 8px 24px; background: #2563eb; color: #fff; border: 0; }
    .spin { width: 200px; height: 80px; animation: pulse 2s infinite; background: #fde68a; }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    .fade { opacity: 0; transition: opacity 0.2s; }
    .fade.in { opacity: 1; }
    .wide { width: 600px; height: 10px; }
    .squeeze { display: flex; } .squeeze .fixed { flex: 0 0 360px; } .squeeze p { min-width: 0; font-size: 16px; }
  </style>
</head>
<body>
  <h1 class="fade" id="title">대시보드 제목</h1>
  <p class="neon">네온 문구</p>
  <div class="grid">
    <div class="card"><p class="tag-blue">파랑 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
    <div class="card"><p class="tag-green">초록 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
    <div class="card"><p class="tag-red">빨강 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
    <div class="card"><p class="tag-orange">주황 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
    <div class="card"><p class="tag-blue">파랑 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
    <div class="card"><p class="tag-green">초록 지표 하나 둘 셋</p><p class="faint">흐린 설명 문장입니다</p></div>
  </div>
  <p class="body-ko">한글 본문이 작고 줄 간격이 좁아서 읽기 어려운 문단입니다. 이 문장은 길게 이어져서 여러 줄로 넘어갑니다.</p>
  <button class="pill" type="button">시작하기 버튼</button>
  <div class="spin"></div>
  <div class="wide"></div>
  <div class="squeeze"><div class="fixed"></div><p>좁은 화면에서 한 줄에 한두 자씩 떨어지는 문단</p></div>
  <script>
    requestAnimationFrame(() => setTimeout(() => document.getElementById("title").classList.add("in"), 300));
  </script>
</body>
</html>
