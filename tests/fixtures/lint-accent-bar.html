<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>왼쪽 강조 막대 예시</title>
  <style>
    body { margin: 0; background: #ffffff; color: #111111; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-family: Georgia, serif; font-size: 36px; margin: 0 0 32px; }
    p, blockquote, div { font-size: 16px; line-height: 1.7; margin: 0 0 16px; padding: 8px 16px; }

    /* 잡아야 할 막대 */
    .bar-border { border-left: 4px solid #1d4ed8; }
    .bar-thicker { border: 1px solid #dddddd; border-left: 4px solid #444444; }
    .bar-inset { box-shadow: inset 3px 0 0 #444444; }
    .bar-pseudo { position: relative; }
    .bar-pseudo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #444444; }

    /* 막대가 아닌 것 */
    .even-box { border: 2px solid #dddddd; }
    .divider { border-left: 1px solid #e5e5e5; }
    .underline { border-bottom: 3px solid #1d4ed8; }
    .top-inset { box-shadow: inset 0 1px 0 #dddddd; }
    .dot { position: relative; }
    .dot::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; background: #444444; }
  </style>
</head>
<body>
  <main>
    <h1>Callouts</h1>
    <div class="bar-border">왼쪽 border만 굵고 색이 있는 콜아웃</div>
    <div class="bar-thicker">세 변보다 왼쪽이 훨씬 굵은 콜아웃</div>
    <blockquote class="bar-inset">inset 그림자로 그린 인용 막대</blockquote>
    <div class="bar-pseudo">가상 요소로 그린 세로 막대</div>

    <div class="even-box">네 변이 같은 굵기인 상자</div>
    <div class="divider">회색 1px 구분선이 왼쪽에 있는 영역</div>
    <div class="underline">아래 변만 굵은 제목 줄</div>
    <div class="top-inset">위쪽 inset 선이 있는 행</div>
    <div class="dot">작은 점 가상 요소가 있는 항목</div>
  </main>
</body>
</html>
